# GitHub Pages builds this repository with Jekyll. The site itself is static
# HTML and needs no Jekyll features; this file exists only to keep the
# repository's working documents off dovilo.app. Without it, Jekyll renders
# every Markdown file into a public page (/CLAUDE.html, /docs/design-language.html).
# A new internal Markdown file goes on this list in the same commit. docs/brand
# holds the icon sources that tools/build-icons.mjs rasterises; the site serves
# the generated files, never the sources. src holds the templates and strings
# tools/build-pages.mjs renders into /, /ai/, /pricing/, /downloads/ and /faq/;
# the site serves the built pages, never the templates.
#
# The images below are referenced by no page, and they kept the deploy artifact
# at 81 MB when the site uses 14. screenshots/new holds the full-frame sources
# tools/build-captures.mjs crops; the rest are captures the redesign retired,
# kept in the repository, not served. Jekyll also excludes any path that starts
# with an entry, so list a file with its extension: "screenshots/mobile-city"
# would take mobile-city-26-772.webp, which the home page uses, with it.
exclude:
  - CLAUDE.md
  - README.md
  - docs/design-language.md
  - docs/dovilo-landing-l10n-analysis.md
  - docs/copy
  - docs/brand
  - src
  - screenshots/new
  - hero.jpg
