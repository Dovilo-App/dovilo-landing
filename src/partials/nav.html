<a class="skip-link" href="#main">{{c.nav.skip}}</a>

  <header class="nav">
    <div class="container nav-inner">
      <a class="nav-logo" href="{{href.home}}"><img src="/dovilo-logo.webp" width="32" height="32" alt="">Dovilo</a>
      <nav aria-label="{{c.nav.label}}">
        <ul class="nav-links" id="nav-links">
          <li><a href="{{href.ai}}"{{current.ai}}>{{c.nav.ai}}</a></li>
          <li><a href="{{href.pricing}}"{{current.pricing}}>{{c.nav.pricing}}</a></li>
          <li><a href="{{href.downloads}}"{{current.downloads}}>{{c.nav.downloads}}</a></li>
          <li><a href="{{href.faq}}"{{current.faq}}>{{c.nav.faq}}</a></li>
          <li><a href="/blog/"{{current.blog}}>{{c.nav.blog}}</a></li>
        </ul>
      </nav>
      <div class="nav-actions">
        {{#if alternates}}<details class="lang-menu">
          <summary class="icon-btn" aria-label="{{c.nav.language}}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.4 2.5 3.6 5.5 3.6 9s-1.2 6.5-3.6 9c-2.4-2.5-3.6-5.5-3.6-9S9.6 5.5 12 3z"/></svg>
          </summary>
          <ul class="lang-menu-list">
{{#each alternates}}            <li><a href="{{this.href}}" lang="{{this.code}}" hreflang="{{this.code}}"{{this.current}}>{{this.name}}</a></li>
{{/each}}          </ul>
        </details>
        {{/if}}<button class="icon-btn theme-toggle" type="button" aria-label="{{c.nav.theme}}">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="icon-btn nav-menu" type="button" aria-label="{{c.nav.menu}}" aria-expanded="false" aria-controls="nav-links">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
      </div>
    </div>
  </header>
